<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <meta name="google-site-verification" content="PnEzym5TDHD1qt3sfGdv5199iC9TrZ78o5uynPiIC-k" />

  <title>Campus C Lab by SP - Interactive Online C Compiler</title>
  <meta name="description" content="Campus C Lab by SP is a free interactive online C compiler for B.Tech students with syntax highlighting and step-by-step live terminal input." />
  <meta name="keywords" content="Campus C Lab, Campus C Lab by SP, C compile by sp, interactive C compiler, online C terminal, saurabhkumar16092-debug" />
  <meta name="author" content="SP (Saurabh Kumar)" />

  <!-- VS Code Style Colorful Syntax Highlighting (CodeMirror) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #11111b;
      color: #cdd6f4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      background-color: #181825;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #313244;
    }
    header h1 {
      font-size: 16px;
      color: #89b4fa;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background-color: #a6e3a1;
      color: #11111b;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 8px;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    #runBtn {
      background-color: #a6e3a1;
      color: #11111b;
    }
    #runBtn:disabled {
      background-color: #585b70;
      color: #cdd6f4;
    }
    #clearBtn {
      background-color: #313244;
      color: #cdd6f4;
    }

    /* Top Colorful Editor Section */
    .editor-container {
      flex: 1.15;
      display: flex;
      flex-direction: column;
      border-bottom: 2px solid #45475a;
      min-height: 0;
    }
    .section-label {
      background-color: #1e1e2e;
      color: #a6adc8;
      font-size: 11px;
      padding: 5px 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #282a36;
    }
    .CodeMirror {
      flex: 1;
      height: 100% !important;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Bottom Interactive Terminal Section */
    .terminal-container {
      flex: 0.85;
      display: flex;
      flex-direction: column;
      background-color: #0b0b12;
      min-height: 0;
    }
    #terminalOutput {
      flex: 1;
      padding: 10px 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      line-height: 1.5;
      color: #a6e3a1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user-typed {
      color: #89dceb;
      font-weight: bold;
    }
    .error-text {
      color: #f38ba8;
    }
    .system-text {
      color: #f9e2af;
      font-style: italic;
    }

    /* Live Input Bar */
    .input-bar {
      display: flex;
      background-color: #181825;
      border-top: 1px solid #313244;
      padding: 8px;
      gap: 6px;
      align-items: center;
    }
    .prompt-symbol {
      color: #a6e3a1;
      font-family: monospace;
      font-weight: bold;
      font-size: 16px;
    }
    #termInput {
      flex: 1;
      background-color: #11111b;
      color: #ffffff;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 9px 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      outline: none;
    }
    #termInput:focus {
      border-color: #89b4fa;
    }
    #sendInputBtn {
      background-color: #89b4fa;
      color: #11111b;
      padding: 9px 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Campus C Lab <span class="badge">LIVE GCC</span></h1>
    <div class="btn-group">
      <button id="clearBtn" onclick="clearTerminal()">Clear</button>
      <button id="runBtn" onclick="startExecution()">▶ Run</button>
    </div>
  </header>

  <!-- TOP: Colorful Code Editor -->
  <div class="editor-container">
    <div class="section-label">
      <span>main.c (Colorful Editor)</span>
      <span>By SP</span>
    </div>
    <textarea id="codeEditor">#include <stdio.h>

int main() {
    int a, b, sum;
    printf("Pehla number enter karein: ");
    scanf("%d", &a);
    
    printf("Doosra number enter karein: ");
    scanf("%d", &b);
    
    sum = a + b;
    printf("\nDono numbers ka jod = %d\n", sum);
    return 0;
}</textarea>
  </div>

  <!-- BOTTOM: Interactive Step-by-Step Terminal -->
  <div class="terminal-container" onclick="focusInput()">
    <div class="section-label">
      <span>Terminal Output</span>
      <span id="statusText" style="color: #89b4fa;">Ready</span>
    </div>
    <div id="terminalOutput">▶ 'Run' dabane ke baad yahan ek-ek karke output aayega aur neeche input box me aap value dal sakte hain...</div>
    <div class="input-bar">
      <span class="prompt-symbol">&gt;</span>
      <input type="text" id="termInput" placeholder="Yahan input likhein aur Enter dabaein..." disabled />
      <button id="sendInputBtn" onclick="submitStepInput()" disabled>Enter ↵</button>
    </div>
  </div>

  <script>
    // Initialize Colorful C Code Editor
    const editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
      mode: 'text/x-csrc',
      theme: 'dracula',
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      lineWrapping: true
    });

    const terminalOutput = document.getElementById('terminalOutput');
    const termInput = document.getElementById('termInput');
    const sendInputBtn = document.getElementById('sendInputBtn');
    const runBtn = document.getElementById('runBtn');
    const statusText = document.getElementById('statusText');

    let collectedInputs = [];
    let isRunning = false;
    let lastShownLength = 0;

    function focusInput() {
      if (!termInput.disabled) {
        termInput.focus();
      }
    }

    function clearTerminal() {
      terminalOutput.innerHTML = '';
      statusText.textContent = 'Ready';
    }

    termInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitStepInput();
      }
    });

    // Automatically inject unbuffered stdout so printf shows BEFORE scanf!
    function prepareCodeForLiveOutput(rawCode) {
      const helper = `\n#include <stdio.h>\n__attribute__((constructor)) void _sp_unbuffer() { setbuf(stdout, NULL); }\n`;
      return helper + rawCode;
    }

    async function startExecution() {
      collectedInputs = [];
      lastShownLength = 0;
      isRunning = true;
      terminalOutput.innerHTML = '<span class="system-text">Compiling & running...</span>\n';
      runBtn.disabled = true;
      statusText.textContent = 'Running...';
      await executeStep();
    }

    async function executeStep() {
      const userCode = editor.getValue();
      const executableCode = prepareCodeForLiveOutput(userCode);
      const stdinPayload = collectedInputs.length > 0 ? collectedInputs.join('\n') + '\n' : '';

      try {
        const response = await fetch('https://emkc.org/api/v2/piston/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            language: 'c',
            version: '10.2.0',
            files: [{ name: 'main.c', content: executableCode }],
            stdin: stdinPayload,
            run_timeout: 3000
          })
        });

        const data = await response.json();

        if (data.compile && data.compile.code !== 0) {
          let errMsg = (data.compile.stderr || data.compile.output || '').replace(/main\.c:\d+:\d+:/g, 'Line:');
          terminalOutput.innerHTML = '<span class="error-text">Compilation Error:\n' + escapeHtml(errMsg) + '</span>';
          finishExecution('Error');
          return;
        }

        const runOut = data.run ? (data.run.stdout || '') : '';
        const runErr = data.run ? (data.run.stderr || '') : '';
        const exitCode = data.run ? data.run.code : 0;

        if (collectedInputs.length === 0) {
          terminalOutput.innerHTML = '';
        }

        if (runOut.length > lastShownLength) {
          const newChunk = runOut.substring(lastShownLength);
          terminalOutput.innerHTML += escapeHtml(newChunk);
          lastShownLength = runOut.length;
        }

        if (runErr) {
          terminalOutput.innerHTML += '\n<span class="error-text">' + escapeHtml(runErr) + '</span>';
        }

        terminalOutput.scrollTop = terminalOutput.scrollHeight;

        const scanfCount = (userCode.match(/\bscanf\s*\(/g) || []).length;
        const hasLoop = /\b(for|while)\b/.test(userCode);

        if ((collectedInputs.length < scanfCount || (hasLoop && exitCode === 0 && collectedInputs.length < 30)) && !runErr && !isLikelyFinished(runOut)) {
          statusText.textContent = 'Enter Input ↓';
          termInput.disabled = false;
          sendInputBtn.disabled = false;
          termInput.value = '';
          termInput.focus();
        } else {
          terminalOutput.innerHTML += '\n\n<span class="system-text">--- Program Finished (Exit Code: ' + exitCode + ') ---</span>';
          terminalOutput.scrollTop = terminalOutput.scrollHeight;
          finishExecution('Finished');
        }

      } catch (err) {
        terminalOutput.innerHTML += '\n<span class="error-text">Network Error: Server se connect nahi ho paya.</span>';
        finishExecution('Failed');
      }
    }

    function isLikelyFinished(output) {
      const lines = output.trim().split('\n');
      const lastLine = lines[lines.length - 1] || '';
      if (output.endsWith('\n') && !/[:?=>]\s*$/.test(lastLine)) {
        return true;
      }
      return false;
    }

    async function submitStepInput() {
      if (!isRunning || termInput.disabled) return;
      const val = termInput.value;
      
      terminalOutput.innerHTML += '<span class="user-typed">' + escapeHtml(val) + '</span>\n';
      terminalOutput.scrollTop = terminalOutput.scrollHeight;

      collectedInputs.push(val);
      termInput.value = '';
      termInput.disabled = true;
      sendInputBtn.disabled = true;
      statusText.textContent = 'Running...';

      await executeStep();
    }

    function finishExecution(status) {
      isRunning = false;
      runBtn.disabled = false;
      termInput.disabled = true;
      sendInputBtn.disabled = true;
      statusText.textContent = status;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>

</body>
</html>
