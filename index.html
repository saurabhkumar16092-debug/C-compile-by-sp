<body>

  <header>
    <h1>⚡ Campus C Lab</h1>
    <div class="btn-group">
      <button id="historyBtn" onclick="openHistory()">🕒 History</button>
      <select id="exampleSelect" onchange="loadExampleProgram()" title="Lab Programs">
        <option value="">📂 Examples</option>
        <option value="add">1. Add 2 Numbers</option>
        <option value="matrix">2. Matrix Addition</option>
        <option value="prime">3. Prime Number</option>
        <option value="fact">4. Factorial</option>
      </select>
      <button id="clearBtn" onclick="clearTerminal()">Clear</button>
      <button id="runBtn" onclick="startExecution()">▶ Run</button>
    </div>
  </header>

  <div class="editor-container">
    <div class="section-label">
      <span>main.c <span id="saveStatus" class="save-indicator">• Auto-saved</span></span>
      <span>By SP</span>
    </div>
    <textarea id="codeEditor">#include <stdio.h>

int main() {
    int a, b, sum;
    printf("Enter first and second number: ");
    scanf("%d %d", &a, &b);
    sum = a + b;
    printf("Sum of two numbers = %d\n", sum);
    return 0;
}</textarea>
  </div>

  <div class="terminal-container" onclick="focusInput()">
    <div class="section-label">
      <span>Terminal Output</span>
      <span id="statusText" style="color: #89b4fa;">Ready</span>
    </div>
    <div id="terminalOutput">▶ 'Run' dabane ke baad yahan output aayega aur neeche input box me aap value dal sakte hain...</div>
    <div class="input-bar">
      <span class="prompt-symbol">&gt;</span>
      <input type="text" id="termInput" placeholder="Yahan input likhein aur Enter dabaein..." disabled />
      <button id="sendInputBtn" onclick="submitStepInput()" disabled>Enter ↵</button>
    </div>
  </div>

  <div id="historyModal" onclick="if(event.target===this) closeHistory()">
    <div class="modal-box">
      <div class="modal-header">
        <h3>🕒 Pichle Programs (Saved History)</h3>
        <button style="background:#f38ba8; color:#11111b; padding:4px 9px;" onclick="closeHistory()">✕</button>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const EXAMPLES = {
      add: `#include <stdio.h>\n\nint main() {\n    int a, b, sum;\n    printf("Enter first and second number: ");\n    scanf("%d %d", &a, &b);\n    sum = a + b;\n    printf("Sum of two numbers = %d\\n", sum);\n    return 0;\n}`,
      matrix: `#include <stdio.h>\n\nint main() {\n    int r, c, i, j;\n    int A[10][10], B[10][10], sum[10][10];\n\n    printf("Rows aur columns enter karein: ");\n    scanf("%d %d", &r, &c);\n\n    printf("Pehli matrix ke elements enter karein:\\n");\n    for (i = 0; i < r; i++)\n        for (j = 0; j < c; j++)\n            scanf("%d", &A[i][j]);\n\n    printf("Doosri matrix ke elements enter karein:\\n");\n    for (i = 0; i < r; i++)\n        for (j = 0; j < c; j++)\n            scanf("%d", &B[i][j]);\n\n    for (i = 0; i < r; i++)\n        for (j = 0; j < c; j++)\n            sum[i][j] = A[i][j] + B[i][j];\n\n    printf("Matrices ka jod:\\n");\n    for (i = 0; i < r; i++) {\n        for (j = 0; j < c; j++)\n            printf("%d\\t", sum[i][j]);\n        printf("\\n");\n    }\n    return 0;\n}`,
      prime: `#include <stdio.h>\n\nint main() {\n    int n, i, flag = 0;\n    printf("Koi positive integer enter karein: ");\n    scanf("%d", &n);\n\n    if (n <= 1) flag = 1;\n    for (i = 2; i <= n / 2; ++i) {\n        if (n % i == 0) {\n            flag = 1;\n            break;\n        }\n    }\n    if (flag == 0)\n        printf("%d ek Prime number hai.\\n", n);\n    else\n        printf("%d Prime number nahi hai.\\n", n);\n    return 0;\n}`,
      fact: `#include <stdio.h>\n\nint main() {\n    int n, i;\n    unsigned long long fact = 1;\n    printf("Factorial ke liye number enter karein: ");\n    scanf("%d", &n);\n\n    for (i = 1; i <= n; ++i) {\n        fact *= i;\n    }\n    printf("Factorial of %d = %llu\\n", n, fact);\n    return 0;\n}`
    };

    const textareaEl = document.getElementById('codeEditor');
    let editor = null;

    if (typeof CodeMirror !== 'undefined') {
      editor = CodeMirror.fromTextArea(textareaEl, {
        mode: 'text/x-csrc',
        theme: 'dracula',
        lineNumbers: true,
        indentUnit: 4,
        tabSize: 4,
        lineWrapping: true
      });
    }

    function getCode() {
      return editor ? editor.getValue() : textareaEl.value;
    }

    function setCode(val) {
      if (editor) {
        editor.setValue(val);
      } else {
        textareaEl.value = val;
      }
    }

    const savedCode = localStorage.getItem('sp_campus_c_code');
    if (savedCode && savedCode.trim() !== '') {
      setCode(savedCode);
    }

    const saveStatus = document.getElementById('saveStatus');
    function onCodeChanged() {
      localStorage.setItem('sp_campus_c_code', getCode());
      saveStatus.textContent = '• Saving...';
      clearTimeout(window._saveTimer);
      window._saveTimer = setTimeout(() => {
        saveStatus.textContent = '• Auto-saved';
      }, 600);
    }

    if (editor) {
      editor.on('change', onCodeChanged);
    } else {
      textareaEl.addEventListener('input', onCodeChanged);
    }

    function saveToHistory(code) {
      if (!code || code.trim() === '') return;
      let history = JSON.parse(localStorage.getItem('sp_c_history') || '[]');
      if (history.length > 0 && history[0].code.trim() === code.trim()) return;

      const now = new Date();
      const timeStr = now.toLocaleDateString('hi-IN') + ' ' + now.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });

      history.unshift({
        time: timeStr,
        code: code
      });

      if (history.length > 15) history = history.slice(0, 15);
      localStorage.setItem('sp_c_history', JSON.stringify(history));
    }

    function openHistory() {
      const listDiv = document.getElementById('historyList');
      const history = JSON.parse(localStorage.getItem('sp_c_history') || '[]');
      listDiv.innerHTML = '';

      if (history.length === 0) {
        listDiv.innerHTML = '<p style="color:#a6adc8; font-size:13px; text-align:center; padding:16px;">Abhi tak koi purana program save nahi hai. Code likhkar Run dabayein, woh yahan apne aap save ho jayega!</p>';
      } else {
        history.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = 'history-item';
          div.innerHTML = `
            <div class="history-meta">
              <span>#${index + 1} • ${escapeHtml(item.time)}</span>
              <span style="color:#a6e3a1;">Load ↵</span>
            </div>
            <div class="history-preview">${escapeHtml(item.code.replace(/\n/g, ' '))}</div>
          `;
          div.onclick = () => {
            setCode(item.code);
            closeHistory();
            clearTerminal();
          };
          listDiv.appendChild(div);
        });
      }
      document.getElementById('historyModal').style.display = 'flex';
    }

    function closeHistory() {
      document.getElementById('historyModal').style.display = 'none';
    }

    function loadExampleProgram() {
      const sel = document.getElementById('exampleSelect');
      if (sel.value && EXAMPLES[sel.value]) {
        saveToHistory(getCode());
        setCode(EXAMPLES[sel.value]);
        clearTerminal();
      }
      sel.value = '';
    }

    const terminalOutput = document.getElementById('terminalOutput');
    const termInput = document.getElementById('termInput');
    const sendInputBtn = document.getElementById('sendInputBtn');
    const runBtn = document.getElementById('runBtn');
    const statusText = document.getElementById('statusText');

    let scanGroups = [];
    let collectedTokens = [];
    let currentGroupIdx = 0;
    let tokensCollectedInGroup = 0;
    let isRunning = false;
    let knownVars = {};

    function focusInput() {
      if (!termInput.disabled) termInput.focus();
    }

    function clearTerminal() {
      terminalOutput.innerHTML = '';
      statusText.textContent = 'Ready';
    }

    termInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitStepInput();
      }
    });

    function analyzeCodeInputSteps(code) {
      const clean = code.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '');
      const groups = [];
      let pendingPrompt = '';
      const lines = clean.split('\n');
      let activeLoops = [];

      for (let idx = 0; idx < lines.length; idx++) {
        const line = lines[idx].trim();
        const forMatch = line.match(/\bfor\s*\([^;]*;\s*[a-zA-Z_]\w*\s*(<=|<)\s*([a-zA-Z0-9_]+)\s*;/);
        if (forMatch) {
          activeLoops.push({ op: forMatch[1], bound: forMatch[2], lineIdx: idx });
        }

        const printfMatch = line.match(/\bprintf\s*\(\s*"((?:[^"\\]|\\.)*)"\s*\)\s*;/);
        if (printfMatch && !/%[sdfclux]/i.test(printfMatch[1])) {
          pendingPrompt += printfMatch[1]
            .replace(/\\n/g, '\n')
            .replace(/\\t/g, '\t')
            .replace(/\\"/g, '"');
        }

        const scanfMatch = line.match(/\bscanf\s*\(\s*"([^"]*)"\s*,\s*([^)]+)\)/);
        if (scanfMatch) {
          const fmt = scanfMatch[1];
          const varsRaw = scanfMatch[2];
          const specifiers = fmt.match(/%[0-9.]*[diuoxXfFeEgGaAcsp]/g) || ['%d'];
          const varNames = varsRaw.split(',').map(v => v.replace(/&/g, '').trim());
          const recentLoops = activeLoops.filter(l => idx - l.lineIdx <= 4);

          groups.push({
            prompt: pendingPrompt || 'Enter value: ',
            perIterationCount: specifiers.length,
            specifiers: specifiers,
            varNames: varNames,
            loops: recentLoops
          });

          pendingPrompt = '';
          activeLoops = [];
        }
      }
      return groups;
    }

    function computeExpectedTokensForGroup(group) {
      let multiplier = 1;
      for (const lp of group.loops) {
        let boundVal = parseInt(lp.bound, 10);
        if (isNaN(boundVal)) {
          boundVal = knownVars[lp.bound] !== undefined ? knownVars[lp.bound] : 1;
        }
        if (lp.op === '<=') boundVal += 1;
        if (boundVal > 0) multiplier *= boundVal;
      }
      return group.perIterationCount * multiplier;
    }

    async function startExecution() {
      const code = getCode();
      saveToHistory(code);
      collectedTokens = [];
      currentGroupIdx = 0;
      tokensCollectedInGroup = 0;
      knownVars = {};
      isRunning = true;
      terminalOutput.innerHTML = '';
      runBtn.disabled = true;

      scanGroups = analyzeCodeInputSteps(code);

      if (scanGroups.length > 0) {
        showCurrentGroupPrompt(true);
      } else {
        await compileAndRunFinal();
      }
    }

    function showCurrentGroupPrompt(isFirstShow) {
      const grp = scanGroups[currentGroupIdx];
      const totalNeeded = computeExpectedTokensForGroup(grp);
      const remaining = totalNeeded - tokensCollectedInGroup;

      if (isFirstShow) {
        terminalOutput.innerHTML += escapeHtml(grp.prompt);
      } else {
        terminalOutput.innerHTML += `<span class="hint-text">↳ Bache hue ${remaining} element(s) enter karein: </span>`;
      }
      terminalOutput.scrollTop = terminalOutput.scrollHeight;

      statusText.textContent = `Input (${tokensCollectedInGroup}/${totalNeeded})`;
      termInput.disabled = false;
      sendInputBtn.disabled = false;
      termInput.value = '';
      termInput.placeholder = totalNeeded > 1
        ? `${remaining} value(s) bache hain...`
        : `Value likhein aur Enter dabaein...`;
      termInput.focus();
    }

    async function submitStepInput() {
      if (!isRunning || termInput.disabled) return;
      const raw = termInput.value.trim();

      if (raw === '') {
        terminalOutput.innerHTML += `\n<span class="error-text">⚠ Khali input nahi chalega! Value enter karein: </span>`;
        terminalOutput.scrollTop = terminalOutput.scrollHeight;
        termInput.focus();
        return;
      }

      const grp = scanGroups[currentGroupIdx];
      const totalNeeded = computeExpectedTokensForGroup(grp);
      const newTokens = raw.split(/\s+/);

      for (let i = 0; i < newTokens.length; i++) {
        const specIndex = (tokensCollectedInGroup + i) % grp.specifiers.length;
        const spec = grp.specifiers[specIndex];
        if (/%[diu]/i.test(spec) && !/^-?\d+$/.test(newTokens[i])) {
          terminalOutput.innerHTML += `<span class="user-typed">${escapeHtml(raw)}</span>\n<span class="error-text">⚠ Type Error: '${escapeHtml(newTokens[i])}' integer (%d) nahi hai! Dobara enter karein: </span>`;
          terminalOutput.scrollTop = terminalOutput.scrollHeight;
          termInput.value = '';
          termInput.focus();
          return;
        }
      }

      terminalOutput.innerHTML += `<span class="user-typed">${escapeHtml(raw)}</span>\n`;
      terminalOutput.scrollTop = terminalOutput.scrollHeight;

      if (grp.loops.length === 0) {
        newTokens.forEach((tok, idx) => {
          const vName = grp.varNames[tokensCollectedInGroup + idx];
          if (vName && !isNaN(parseInt(tok, 10))) {
            knownVars[vName] = parseInt(tok, 10);
          }
        });
      }

      collec
