<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="google-site-verification" content="PnEzym5TDHD1qt3sfGdv5199iC9TrZ78o5uynPiIC-k" />

  <title>Campus C Lab by SP - Free Online Interactive C Compiler</title>
  <meta name="description" content="Campus C Lab by SP is a fast, free interactive online C compiler for B.Tech students to write, compile, and run C programs with live terminal input on mobile and desktop." />
  <meta name="keywords" content="Campus C Lab, Campus C Lab by SP, C compile by sp, interactive C compiler, online C terminal, saurabhkumar16092-debug" />
  <meta name="author" content="SP (Saurabh Kumar)" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #11111b;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #181825;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #313244;
    }
    header h1 {
      font-size: 17px;
      color: #89b4fa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background-color: #a6e3a1;
      color: #11111b;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: bold;
    }
    .tip-bar {
      background-color: #1e1e2e;
      color: #f9e2af;
      font-size: 12px;
      padding: 6px 14px;
      border-bottom: 1px solid #313244;
      text-align: center;
    }
    .compiler-frame {
      flex: 1;
      width: 100%;
      border: none;
      background-color: #1e1e2e;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Campus C Lab <span class="badge">LIVE GCC</span></h1>
    <span style="font-size: 12px; color: #a6adc8;">By SP</span>
  </header>

  <div class="tip-bar">
    💡 Tip: <b>Execute / Run</b> दबाने के बाद नीचे काले Result बॉक्स में टच करके कीबोर्ड से इनपुट लिखें।
  </div>

  <!-- 100% Embed-Supported Interactive C Compiler -->
  <iframe 
    class="compiler-frame" 
    src="https://www.jdoodle.com/embed/v1/c" 
    allow="clipboard-write"
    title="Campus C Interactive Compiler">
  </iframe>

</body>
</html>
