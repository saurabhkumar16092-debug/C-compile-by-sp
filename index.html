<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <meta name="google-site-verification" content="PnEzym5TDHD1qt3sfGdv5199iC9TrZ78o5uynPiIC-k" />

  <title>Campus C Lab by SP - Interactive Online C Compiler</title>
  <meta name="description" content="Campus C Lab by SP is a free interactive online C compiler for B.Tech students with syntax highlighting, auto-save, and step-by-step live terminal input." />
  <meta name="keywords" content="Campus C Lab, Campus C Lab by SP, C compile by sp, interactive C compiler, online C terminal, saurabhkumar16092-debug" />
  <meta name="author" content="SP (Saurabh Kumar)" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #11111b;
      color: #cdd6f4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      background-color: #181825;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #313244;
      gap: 6px;
    }
    header h1 {
      font-size: 15px;
      color: #89b4fa;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .badge {
      background-color: #a6e3a1;
      color: #11111b;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 8px;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    select#exampleSelect {
      background-color: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      outline: none;
      max-width: 110px;
    }
    button {
      border: none;
      padding: 7px 11px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    #runBtn {
      background-color: #a6e3a1;
      color: #11111b;
    }
    #runBtn:disabled {
      background-color: #585b70;
      color: #cdd6f4;
    }
    #clearBtn {
      background-color: #313244;
      color: #cdd6f4;
    }

    .editor-container {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      border-bottom: 2px solid #45475a;
      min-height: 0;
    }
    .section-label {
      background-color: #1e1e2e;
      color: #a6adc8;
      font-size: 11px;
      padding: 4px 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #282a36;
    }
    .save-indicator {
      color: #a6e3a1;
      font-size: 10px;
      text-transform: none;
    }
    .CodeMirror {
      flex: 1;
      height: 100% !important;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      line-height: 1.5;
    }

    .terminal-container {
      flex: 0.9;
      display: flex;
      flex-direction: column;
      background-color: #0b0b12;
      min-height: 0;
    }
    #terminalOutput {
      flex: 1;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      line-height: 1.5;
      color: #a6e3a1;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user-typed {
      color: #89dceb;
      font-weight: bold;
    }
    .error-text {
      color: #f38ba8;
    }
    .system-text {
      color: #f9e2af;
      font-style: italic;
    }
    .hint-text {
      color: #94e2d5;
      font-size: 13px;
    }

    .input-bar {
      display: flex;
      background-color: #181825;
      border-top: 1px solid #313244;
      padding: 8px;
      gap: 6px;
      align-items: center;
    }
    .prompt-symbol {
      color: #a6e3a1;
      font-family: monospace;
      font-weight: bold;
      font-size: 17px;
    }
    #termInput {
      flex: 1;
      background-color: #11111b;
      color: #ffffff;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      outline: none;
    }
    #termInput:focus {
      border-color: #89b4fa;
    }
    #sendInputBtn {
      background-color: #89b4fa;
      color: #11111b;
      padding: 10px 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Campus C Lab <span class="badge">LIVE GCC</span></h1>
    <div class="btn-group">
      <select id="exampleSelect" onchange="loadExampleProgram()" title="Lab Programs">
        <option value="">📂 Examples</option>
        <option value="add">1. Add 2 Numbers</option>
        <option value="matrix">2. Matrix Addition</option>
        <option value="prime">3. Prime Number</option>
        <option value="fact">4. Factorial</option>
      </select>
      <button id="clearBtn" onclick="clearTerminal()">Clear</button>
      <button id="runBtn" onclick="startExecution()">▶ Run</button>
    </div>
  </header>

  <div class="editor-container">
    <div class="section-label">
      <span>main.c <span id="saveStatus" class="save-indicator">• Auto-saved</span></span>
      <span>By SP</span>
    </div>
    <textarea id="codeEditor">#include <stdio.h>

int main() {
    int a, b, sum;
    printf("Enter first and second number: ");
    scanf("%d %d", &a, &b);
    sum = a + b;
    printf("Sum of two numbers = %d\n", sum);
    return 0;
}</textarea>
  </div>

  <div class="terminal-container" onclick="focusInput()">
    <div class="section-label">
      <span>Terminal Output</span>
      <span id="statusText" style="color: #89b4fa;">Ready</span>
    </div>
    <div id="terminalOutput">▶ 'Run' dabane ke baad yahan output aayega aur neeche input box me aap value dal sakte hain...</div>
    <div class="input-bar">
      <span class="prompt-symbol">&gt;</span>
      <input type="text" id="termInput" placeholder="Yahan input likhein aur Enter dabaein..." disabled />
      <button id="sendInputBtn" onclick="submitStepInput()" disabled>Enter ↵</button>
    </div>
  </div>

  <script>
    const EXAMPLES = {
      add: `#include <stdio.h>\n\nint main() {\n    int a, b, sum;\n    printf("Enter first and second number: ");\n    scanf("%d %d", &a, &b);\n    sum = a + b;\n    printf("Sum of two numbers = %d\\n", sum);\n    return 0;\n}`,
      matrix: `#include <stdio.h>\n\nint main() {\n    int r, c, i, j;\n    int A[10][10], B[10][10], sum[10][10];\n\n    printf("Rows aur columns enter karein: ");\n    scanf("%d %d", &r, &c);\n\n    printf("Pehli matrix ke elements enter karein:\\n");\n    for (i = 0; i < r; i++)\n        for (j = 0; j < c; j++)\n            scanf("%d", &A[i][j]);\n\n    printf("Doosri matrix ke elements enter karein:\\n");\n    for (i = 0; i < r; i++)\n        for (j = 0; j < c; j++)\n            scanf("%d", &B[i][j]);\n\n    for (i = 0; i < r; i++)\n        for (j = 0; j < c; j++)\n            sum[i][j] = A[i][j] + B[i][j];\n\n    printf("Matrices ka jod:\\n");\n    for (i = 0; i < r; i++) {\n        for (j = 0; j < c; j++)\n            printf("%d\\t", sum[i][j]);\n        printf("\\n");\n    }\n    return 0;\n}`,
      prime: `#include <stdio.h>\n\nint main() {\n    int n, i, flag = 0;\n    printf("Koi positive integer enter karein: ");\n    scanf("%d", &n);\n\n    if (n <= 1) flag = 1;\n    for (i = 2; i <= n / 2; ++i) {\n        if (n % i == 0) {\n            flag = 1;\n            break;\n        }\n    }\n    if (flag == 0)\n        printf("%d ek Prime number hai.\\n", n);\n    else\n        printf("%d Prime number nahi hai.\\n", n);\n    return 0;\n}`,
      fact: `#include <stdio.h>\n\nint main() {\n    int n, i;\n    unsigned long long fact = 1;\n    printf("Factorial ke liye number enter karein: ");\n    scanf("%d", &n);\n\n    for (i = 1; i <= n; ++i) {\n        fact *= i;\n    }\n    printf("Factorial of %d = %llu\\n", n, fact);\n    return 0;\n}`
    };

    const editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
      mode: 'text/x-csrc',
      theme: 'dracula',
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      lineWrapping: true
    });

    // Load auto-saved code if present
    const savedCode = localStorage.getItem('sp_campus_c_code');
    if (savedCode && savedCode.trim() !== '') {
      editor.setValue(savedCode);
    }

    const saveStatus = document.getElementById('saveStatus');
    editor.on('change', () => {
      localStorage.setItem('sp_campus_c_code', editor.getValue());
      saveStatus.textContent = '• Saving...';
      clearTimeout(window._saveTimer);
      window._saveTimer = setTimeout(() => {
        saveStatus.textContent = '• Auto-saved';
      }, 600);
    });

    function loadExampleProgram() {
      const sel = document.getElementById('exampleSelect');
      if (sel.value && EXAMPLES[sel.value]) {
        editor.setValue(EXAMPLES[sel.value]);
        clearTerminal();
      }
      sel.value = '';
    }

    const terminalOutput = document.getElementById('terminalOutput');
    const termInput = document.getElementById('termInput');
    const sendInputBtn = document.getElementById('sendInputBtn');
    const runBtn = document.getElementById('runBtn');
    const statusText = document.getElementById('statusText');

    let scanGroups = [];
    let collectedTokens = [];
    let currentGroupIdx = 0;
    let tokensCollectedInGroup = 0;
    let isRunning = false;
    let knownVars = {};

    function focusInput() {
      if (!termInput.disabled) termInput.focus();
    }

    function clearTerminal() {
      terminalOutput.innerHTML = '';
      statusText.textContent = 'Ready';
    }

    termInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitStepInput();
      }
    });

    function analyzeCodeInputSteps(code) {
      const clean = code.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/.*$/gm, '');
      const groups = [];
      let pendingPrompt = '';
      const lines = clean.split('\n');
      let activeLoops = [];

      for (let idx = 0; idx < lines.length; idx++) {
        const line = lines[idx].trim();
        const forMatch = line.match(/\bfor\s*\([^;]*;\s*[a-zA-Z_]\w*\s*(<=|<)\s*([a-zA-Z0-9_]+)\s*;/);
        if (forMatch) {
          activeLoops.push({ op: forMatch[1], bound: forMatch[2], lineIdx: idx });
        }

        const printfMatch = line.match(/\bprintf\s*\(\s*"((?:[^"\\]|\\.)*)"\s*\)\s*;/);
        if (printfMatch && !/%[sdfclux]/i.test(printfMatch[1])) {
          pendingPrompt += printfMatch[1]
            .replace(/\\n/g, '\n')
            .replace(/\\t/g, '\t')
            .replace(/\\"/g, '"');
        }

        const scanfMatch = line.match(/\bscanf\s*\(\s*"([^"]*)"\s*,\s*([^)]+)\)/);
        if (scanfMatch) {
          const fmt = scanfMatch[1];
          const varsRaw = scanfMatch[2];
          const specifiers = fmt.match(/%[0-9.]*[diuoxXfFeEgGaAcsp]/g) || ['%d'];
          const varNames = varsRaw.split(',').map(v => v.replace(/&/g, '').trim());
          const recentLoops = activeLoops.filter(l => idx - l.lineIdx <= 4);

          groups.push({
            prompt: pendingPrompt || 'Enter value: ',
            perIterationCount: specifiers.length,
            specifiers: specifiers,
            varNames: varNames,
            loops: recentLoops
          });

          pendingPrompt = '';
          activeLoops = [];
        }
      }
      return groups;
    }

    function computeExpectedTokensForGroup(group) {
      let multiplier = 1;
      for (const lp of group.loops) {
        let boundVal = parseInt(lp.bound, 10);
        if (isNaN(boundVal)) {
          boundVal = knownVars[lp.bound] !== undefined ? knownVars[lp.bound] : 1;
        }
        if (lp.op === '<=') boundVal += 1;
        if (boundVal > 0) multiplier *= boundVal;
      }
      return group.perIterationCount * multiplier;
    }

    async function startExecution() {
      const code = editor.getValue();
      collectedTokens = [];
      currentGroupIdx = 0;
      tokensCollectedInGroup = 0;
      knownVars = {};
      isRunning = true;
      terminalOutput.innerHTML = '';
      runBtn.disabled = true;

      scanGroups = analyzeCodeInputSteps(code);

      if (scanGroups.length > 0) {
        showCurrentGroupPrompt(true);
      } else {
        await compileAndRunFinal();
      }
    }

    function showCurrentGroupPrompt(isFirstShow) {
      const grp = scanGroups[currentGroupIdx];
      const totalNeeded = computeExpectedTokensForGroup(grp);
      const remaining = totalNeeded - tokensCollectedInGroup;

      if (isFirstShow) {
        terminalOutput.innerHTML += escapeHtml(grp.prompt);
      } else {
        terminalOutput.innerHTML += `<span class="hint-text">↳ Bache hue ${remaining} element(s) enter karein: </span>`;
      }
      terminalOutput.scrollTop = terminalOutput.scrollHeight;

      statusText.textContent = `Input (${tokensCollectedInGroup}/${totalNeeded})`;
      termInput.disabled = false;
      sendInputBtn.disabled = false;
      termInput.value = '';
      termInput.placeholder = totalNeeded > 1
        ? `${remaining} value(s) bache hain...`
        : `Value likhein aur Enter dabaein...`;
      termInput.focus();
    }

    async function submitStepInput() {
      if (!isRunning || termInput.disabled) return;
      const raw = termInput.value.trim();

      if (raw === '') {
        terminalOutput.innerHTML += `\n<span class="error-text">⚠ Khali input nahi chalega! Value enter karein: </span>`;
        terminalOutput.scrollTop = terminalOutput.scrollHeight;
        termInput.focus();
        return;
      }

      const grp = scanGroups[currentGroupIdx];
      const totalNeeded = computeExpectedTokensForGroup(grp);
      const newTokens = raw.split(/\s+/);

      for (let i = 0; i < newTokens.length; i++) {
        const specIndex = (tokensCollectedInGroup + i) % grp.specifiers.length;
        const spec = grp.specifiers[specIndex];
        if (/%[diu]/i.test(spec) && !/^-?\d+$/.test(newTokens[i])) {
          terminalOutput.innerHTML += `<span class="user-typed">${escapeHtml(raw)}</span>\n<span class="error-text">⚠ Type Error: '${escapeHtml(newTokens[i])}' integer (%d) nahi hai! Dobara enter karein: </span>`;
          terminalOutput.scrollTop = terminalOutput.scrollHeight;
          termInput.value = '';
          termInput.focus();
          return;
        }
      }

      terminalOutput.innerHTML += `<span class="user-typed">${escapeHtml(raw)}</span>\n`;
      terminalOutput.scrollTop = terminalOutput.scrollHeight;

      if (grp.loops.length === 0) {
        newTokens.forEach((tok, idx) => {
          const vName = grp.varNames[tokensCollectedInGroup + idx];
          if (vName && !isNaN(parseInt(tok, 10))) {
            knownVars[vName] = parseInt(tok, 10);
          }
        });
      }

      collectedTokens.push(...newTokens);
      tokensCollectedInGroup += newTokens.length;

      termInput.value = '';
      termInput.disabled = true;
      sendInputBtn.disabled = true;

      if (tokensCollectedInGroup < totalNeeded) {
        showCurrentGroupPrompt(false);
      } else {
        currentGroupIdx++;
        tokensCollectedInGroup = 0;
        if (currentGroupIdx < scanGroups.length) {
          showCurrentGroupPrompt(true);
        } else {
          await compileAndRunFinal();
        }
      }
    }

    async function compileAndRunFinal(retryCount = 0) {
      statusText.textContent = retryCount > 0 ? `Retrying (${retryCount})...` : 'Compiling...';
      const code = editor.getValue();
      const stdinPayload = collectedTokens.length > 0 ? collectedTokens.join('\n') + '\n' : '';

      try {
        const response = await fetch('https://wandbox.org/api/compile.json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            compiler: 'gcc-head-c',
            code: code,
            stdin: stdinPayload,
            save: false
          })
        });

        const data = await response.json();

        // Auto-retry if Wandbox container temporarily busy (crun: Resource temporarily unavailable)
        if (data.program_error && data.program_error.includes('Resource temporarily unavailable') && retryCount < 3) {
          await new Promise(res => setTimeout(res, 900));
          return await compileAndRunFinal(retryCount + 1);
        }

        if (data.compiler_error) {
          terminalOutput.innerHTML = '<span class="error-text">Compilation Error:\n' + escapeHtml(data.compiler_error) + '</span>';
          finishExecution('Error');
          return;
        }

        const fullOut = data.program_output || '';
        const progErr = data.program_error || '';
        const exitCode = data.status !== undefined ? data.status : '0';

        let remainingOut = fullOut;
        for (const grp of scanGroups) {
          if (remainingOut.startsWith(grp.prompt)) {
            remainingOut = remainingOut.substring(grp.prompt.length);
          }
        }

        if (remainingOut) {
          terminalOutput.innerHTML += escapeHtml(remainingOut);
        }
        if (progErr) {
          terminalOutput.innerHTML += '\n<span class="error-text">' + escapeHtml(progErr) + '</span>';
        }

        terminalOutput.innerHTML += '\n\n<span class="system-text">--- Program Finished (Exit Code: ' + exitCode + ') ---</span>';
        terminalOutput.scrollTop = terminalOutput.scrollHeight;
        finishExecution('Finished');

      } catch (err) {
        if (retryCount < 2) {
          await new Promise(res => setTimeout(res, 900));
          return await compileAndRunFinal(retryCount + 1);
        }
        terminalOutput.innerHTML += '\n<span class="error-text">Network Error: Compiler server se connect nahi ho paya.</span>';
        finishExecution('Failed');
      }
    }

    function finishExecution(status) {
      isRunning = false;
      runBtn.disabled = false;
      termInput.disabled = true;
      sendInputBtn.disabled = true;
      termInput.placeholder = 'Yahan input likhein aur Enter dabaein...';
      statusText.textContent = status;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>

</body>
</html>
