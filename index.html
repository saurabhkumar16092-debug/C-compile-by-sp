<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus C Lab by SP</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: system-ui, Arial, sans-serif;
    background: #0b1120;
    color: #e5e7eb;
    min-height: 100vh;
}

header {
    padding: 15px;
    background: #111827;
    border-bottom: 1px solid #273449;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: #38bdf8;
}

.logo small {
    display: block;
    font-size: 11px;
    color: #94a3b8;
    font-weight: normal;
}

.header-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

button, select {
    padding: 9px 12px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #1e293b;
    color: white;
    cursor: pointer;
    font-size: 13px;
}

button:hover {
    background: #334155;
}

.run-btn {
    background: #16a34a;
    border: none;
    font-weight: bold;
}

.run-btn:hover {
    background: #15803d;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    align-items: center;
}

.toolbar select {
    flex: 1;
    min-width: 160px;
}

.editor-box {
    border: 1px solid #334155;
    border-radius: 10px;
    overflow: hidden;
}

.editor-title {
    padding: 10px 12px;
    background: #111827;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
}

.CodeMirror {
    height: 390px;
    font-size: 14px;
    font-family: Consolas, monospace;
}

.CodeMirror-gutters {
    border-right: 1px solid #334155;
}

.CodeMirror-scroll {
    min-height: 390px;
}

.bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 15px;
}

.panel {
    border: 1px solid #334155;
    border-radius: 10px;
    overflow: hidden;
    background: #111827;
}

.panel-title {
    padding: 11px;
    background: #1e293b;
    font-weight: bold;
    font-size: 14px;
}

.panel-body {
    padding: 12px;
}

#stdin {
    width: 100%;
    min-height: 100px;
    resize: vertical;
    background: #0b1120;
    color: #e5e7eb;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px;
    font-family: monospace;
    font-size: 14px;
}

#output {
    min-height: 100px;
    max-height: 300px;
    overflow: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
    background: #020617;
    color: #4ade80;
    padding: 12px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 14px;
}

.status {
    padding: 10px;
    color: #94a3b8;
    font-size: 12px;
}

footer {
    text-align: center;
    padding: 25px 10px;
    color: #64748b;
    font-size: 12px;
}

.light {
    background: #f1f5f9;
    color: #0f172a;
}

.light header,
.light .editor-title,
.light .panel-title {
    background: #e2e8f0;
    color: #0f172a;
}

.light .panel {
    background: white;
}

.light .CodeMirror {
    border-color: #cbd5e1;
}

.light #stdin {
    background: white;
    color: #111827;
}

.light #output {
    background: #f8fafc;
    color: #166534;
}

.light button,
.light select {
    background: white;
    color: #111827;
    border-color: #cbd5e1;
}

.light .run-btn {
    background: #16a34a;
    color: white;
}

@media(max-width: 650px) {
    header {
        align-items: flex-start;
    }

    .bottom-grid {
        grid-template-columns: 1fr;
    }

    .CodeMirror {
        height: 340px;
        font-size: 13px;
    }

    main {
        padding: 10px;
    }

    button {
        padding: 8px 10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Campus C Lab
        <small>by SP | Online C Programming Lab</small>
    </div>

    <div class="header-buttons">
        <button onclick="toggleTheme()">🌙 Theme</button>
        <button onclick="showHistory()">📚 History</button>
    </div>
</header>

<main>

    <div class="toolbar">

        <select id="examples" onchange="loadExample()">
            <option value="">📖 Select C Example</option>
            <option value="hello">Hello World</option>
            <option value="addition">Addition</option>
            <option value="subtraction">Subtraction</option>
            <option value="multiplication">Multiplication</option>
            <option value="evenodd">Even or Odd</option>
            <option value="largest">Largest Number</option>
            <option value="loop">For Loop</option>
            <option value="table">Multiplication Table</option>
            <option value="factorial">Factorial</option>
            <option value="prime">Prime Number</option>
            <option value="array">Array</option>
            <option value="function">Function</option>
        </select>

        <button onclick="copyCode()">📋 Copy</button>
        <button onclick="downloadCode()">⬇ Download</button>
        <button onclick="clearCode()">🗑 Clear</button>
        <button class="run-btn" onclick="runCode()">▶ RUN</button>
    </div>

    <div class="editor-box">

        <div class="editor-title">
            <span>📄 main.c</span>
            <span id="saveStatus">Auto Save ON</span>
        </div>

        <textarea id="code"></textarea>

    </div>

    <div class="bottom-grid">

        <div class="panel">

            <div class="panel-title">
                ⌨️ Program Input (scanf)
            </div>

            <div class="panel-body">
                <textarea id="stdin" placeholder="Enter input values here.
Example:
10
20

For scanf, values can be separated by spaces or new lines."></textarea>
            </div>

        </div>

        <div class="panel">

            <div class="panel-title">
                💻 Output Terminal
            </div>

            <div class="panel-body">
                <div id="output">Your program output will appear here...</div>
            </div>

        </div>

    </div>

    <div class="status" id="status">
        Ready | C Language | Compiler connected through API when Run is pressed
    </div>

</main>

<footer>
    Campus C Lab by SP · Learn C Programming
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

<script>

/* ===============================
   1. STARTING CODE
================================ */

const starterCode = `#include <stdio.h>

int main() {
    int a, b, sum;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    sum = a + b;

    printf("Sum = %d\\\\n", sum);

    return 0;
}`;


/* ===============================
   2. CODE EXAMPLES
================================ */

const examples = {

hello: `#include <stdio.h>

int main() {
    printf("Hello World!");

    return 0;
}`,

addition: `#include <stdio.h>

int main() {
    int a, b, sum;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    sum = a + b;

    printf("Sum = %d\\\\n", sum);

    return 0;
}`,

subtraction: `#include <stdio.h>

int main() {
    int a, b;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    printf("Difference = %d\\\\n", a - b);

    return 0;
}`,

multiplication: `#include <stdio.h>

int main() {
    int a, b;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    printf("Product = %d\\\\n", a * b);

    return 0;
}`,

evenodd: `#include <stdio.h>

int main() {
    int n;

    printf("Enter a number: ");
    scanf("%d", &n);

    if (n % 2 == 0) {
        printf("Even Number");
    } else {
        printf("Odd Number");
    }

    return 0;
}`,

largest: `#include <stdio.h>

int main() {
    int a, b;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    if (a > b) {
        printf("Largest = %d", a);
    } else {
        printf("Largest = %d", b);
    }

    return 0;
}`,

loop: `#include <stdio.h>

int main() {

    for (int i = 1; i <= 10; i++) {
        printf("%d\\\\n", i);
    }

    return 0;
}`,

table: `#include <stdio.h>

int main() {
    int n;

    printf("Enter number: ");
    scanf("%d", &n);

    for (int i = 1; i <= 10; i++) {
        printf("%d x %d = %d\\\\n", n, i, n * i);
    }

    return 0;
}`,

factorial: `#include <stdio.h>

int main() {
    int n;
    long long fact = 1;

    printf("Enter number: ");
    scanf("%d", &n);

    for (int i = 1; i <= n; i++) {
        fact = fact * i;
    }

    printf("Factorial = %lld", fact);

    return 0;
}`,

prime: `#include <stdio.h>

int main() {
    int n, i, prime = 1;

    printf("Enter number: ");
    scanf("%d", &n);

    if (n <= 1) {
        prime = 0;
    }

    for (i = 2; i * i <= n; i++) {
        if (n % i == 0) {
            prime = 0;
            break;
        }
    }

    if (prime)
        printf("Prime Number");
    else
        printf("Not Prime");

    return 0;
}`,

array: `#include <stdio.h>

int main() {
    int arr[5];
    int i;

    printf("Enter 5 numbers: ");

    for (i = 0; i < 5; i++) {
        scanf("%d", &arr[i]);
    }

    printf("Array Elements:\\\\n");

    for (i = 0; i < 5; i++) {
        printf("%d ", arr[i]);
    }

    return 0;
}`,

function: `#include <stdio.h>

int add(int a, int b) {
    return a + b;
}

int main() {
    int x, y;

    printf("Enter two numbers: ");
    scanf("%d %d", &x, &y);

    printf("Sum = %d", add(x, y));

    return 0;
}`
};


/* ===============================
   3. CODE EDITOR
================================ */

const editor = CodeMirror.fromTextArea(
    document.getElementById("code"),
    {
        mode: "text/x-csrc",
        theme: "dracula",
        lineNumbers: true,
        indentUnit: 4,
        tabSize: 4,
        lineWrapping: false,
        autoCloseBrackets: true,
        matchBrackets: true
    }
);


/* ===============================
   4. AUTO SAVE
================================ */

const savedCode = localStorage.getItem("campus_c_code");

editor.setValue(savedCode || starterCode);

editor.on("change", function() {

    localStorage.setItem(
        "campus_c_code",
        editor.getValue()
    );

    document.getElementById("saveStatus").textContent =
        "✓ Auto Saved";

});


/* ===============================
   5. LOAD EXAMPLE
================================ */

function loadExample() {

    const selected = document.getElementById("examples").value;

    if (!selected) return;

    editor.setValue(examples[selected]);

    document.getElementById("stdin").value = "";

    document.getElementById("output").textContent =
        "Example loaded. Click RUN to execute.";

    document.getElementById("status").textContent =
        "Example loaded: " + selected;
}


/* ===============================
   6. COPY CODE
================================ */

async function copyCode() {

    try {

        await navigator.clipboard.writeText(
            editor.getValue()
        );

        document.getElementById("status").textContent =
            "Code copied successfully!";

    } catch (error) {

        editor.focus();
        editor.execCommand("selectAll");

        document.getElementById("status").textContent =
            "Select code and copy manually.";

    }
}


/* ===============================
   7. DOWNLOAD CODE
================================ */

function downloadCode() {

    const code = editor.getValue();

    const blob = new Blob(
        [code],
        { type: "text/plain" }
    );

    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "main.c";

    link.click();

    URL.revokeObjectURL(link.href);

    document.getElementById("status").textContent =
        "C file downloaded.";
}


/* ===============================
   8. CLEAR EDITOR
================================ */

function clearCode() {

    if (confirm("Clear the complete code?")) {

        editor.setValue("");

        document.getElementById("stdin").value = "";

        document.getElementById("output").textContent =
            "Editor cleared.";

        document.getElementById("status").textContent =
            "Code cleared.";
    }
}


/* ===============================
   9. HISTORY
================================ */

function saveHistory(code) {

    let history = JSON.parse(
        localStorage.getItem("campus_c_history") || "[]"
    );

    history.unshift({
        code: code,
        date: new Date().toLocaleString()
    });

    history = history.slice(0, 20);

    localStorage.setItem(
        "campus_c_history",
        JSON.stringify(history)
    );
}


function showHistory() {

    let history = JSON.parse(
        localStorage.getItem("campus_c_history") || "[]"
    );

    if (history.length === 0) {
        alert("No code history saved yet.");
        return;
    }

    let message = "CODE HISTORY\\n\\n";

    history.forEach((item, index) => {
        message += (index + 1) + ". " + item.date + "\\n";
    });

    let choice = prompt(
        message + "\\nEnter history number to restore:"
    );

    if (choice === null) return;

    let index = Number(choice) - 1;

    if (index >= 0 && index < history.length) {

        editor.setValue(history[index].code);

        document.getElementById("status").textContent =
            "History restored.";
    }
}


/* ===============================
   10. THEME
================================ */

function toggleTheme() {

    document.body.classList.toggle("light");

    const isLight = document.body.classList.contains("light");

    editor.setOption(
        "theme",
        isLight ? "default" : "dracula"
    );

    localStorage.setItem(
        "campus_c_theme",
        isLight ? "light" : "dark"
    );
}


if (localStorage.getItem("campus_c_theme") === "light") {
    document.body.classList.add("light");
    editor.setOption("theme", "default");
}


/* ===============================
   11. RUN C PROGRAM
================================ */

async function runCode() {

    const code = editor.getValue();

    const input = document.getElementById("stdin").value;

    const outputBox = document.getElementById("output");

    const statusBox = document.getElementById("status");

    if (!code.trim()) {

        outputBox.textContent = "Please write some C code first.";

        return;
    }

    outputBox.textContent = "⏳ Compiling and running...";
    statusBox.textContent = "Connecting to C Compiler...";

    saveHistory(code);

    try {

        const response = await fetch(
            "https://emkc.org/api/v2/piston/execute",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    language: "c",
                    version: "*",

                    files: [
                        {
                            name: "main.c",
                            content: code
                        }
                    ],

                    stdin: input,

                    args: [],

                    compile_timeout: 10000,
                    run_timeout: 3000,
                    compile_memory_limit: -1,
                    run_memory_limit: -1
                })
        );

        if (!response.ok) {
            throw new Error(
                "Compiler API error: " + response.status
            );
        }

        const result = await response.json();

        let text = "";

        /* Compiler output */

        if (result.compile) {

            if (result.compile.stderr) {
                text += "COMPILER MESSAGE:\\n";
                text += result.compile.stderr + "\\n";
            }

            if (result.compile.output) {
                text += result.compile.output + "\\n";
            }

            if (result.compile.code !== 0) {

                outputBox.textContent =
                    text || "Compilation failed.";

                statusBox.textContent =
                    "❌ Compilation Error";

                return;
            }
        }

        /* Program output */

        if (result.run) {

            if (result.run.stdout) {
                text += "\\nOUTPUT:\\n";
                text += result.run.stdout;
            }

            if (result.run.stderr) {
                text += "\\nERROR:\\n";
                text += result.run.stderr;
            }

            if (result.run.code !== 0) {
                text += "\\nProgram exited with code: "
                    + result.run.code;
            }
        }

        outputBox.textContent =
            text || "Program executed. No output.";

        statusBox.textContent =
            result.run && result.run.code === 0
                ? "✅ Program executed successfully."
                : "Program finished. Check output.";

    } catch (error) {

        outputBox.textContent =
            "Unable to connect to compiler.\\n\\n"
            + error.message
            + "\\n\\nCheck your internet connection and try again.";

        statusBox.textContent =
            "❌ Compiler connection failed.";
    }
}


/* ===============================
   12. KEYBOARD SHORTCUT
================================ */

editor.setOption("extraKeys", {

    "Ctrl-Enter": function() {
        runCode();
    },

    "Cmd-Enter": function() {
        runCode();
    },

    Tab: function(cm) {
        cm.replaceSelection("    ", "end");
    }

});

</script>

</body>
</html>
