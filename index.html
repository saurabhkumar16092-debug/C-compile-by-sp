<script>
const EX={
  add:`#include <stdio.h>\n\nint main() {\n    int a, b, sum;\n    printf("Enter first and second number: ");\n    scanf("%d %d", &a, &b);\n    sum = a + b;\n    printf("Sum of two numbers = %d\\n", sum);\n    return 0;\n}`,
  matrix:`#include <stdio.h>\n\nint main() {\n    int r, c, i, j, A[10][10], B[10][10], sum[10][10];\n    printf("Rows aur columns enter karein: ");\n    scanf("%d %d", &r, &c);\n    printf("Pehli matrix ke elements:\\n");\n    for(i=0;i<r;i++) for(j=0;j<c;j++) scanf("%d",&A[i][j]);\n    printf("Doosri matrix ke elements:\\n");\n    for(i=0;i<r;i++) for(j=0;j<c;j++) scanf("%d",&B[i][j]);\n    for(i=0;i<r;i++) for(j=0;j<c;j++) sum[i][j]=A[i][j]+B[i][j];\n    printf("Matrices ka jod:\\n");\n    for(i=0;i<r;i++){for(j=0;j<c;j++)printf("%d\\t",sum[i][j]);printf("\\n");}\n    return 0;\n}`,
  matmul:`#include <stdio.h>\n#define MAX 10\n\nint main() {\n    int a[MAX][MAX], b[MAX][MAX], c[MAX][MAX];\n    int r1, c1, r2, c2;\n\n    printf("Pehle matrix ki rows aur columns darj karein: ");\n    scanf("%d %d", &r1, &c1);\n\n    printf("Doosre matrix ki rows aur columns darj karein: ");\n    scanf("%d %d", &r2, &c2);\n\n    if (c1 != r2) {\n        printf("Guna sambhav nahi hai: pehle matrix ke columns, doosre ke rows ke barabar hone chahiye.\\n");\n        return 1;\n    }\n\n    printf("Pehle matrix ke elements darj karein:\\n");\n    for (int i = 0; i < r1; i++)\n        for (int j = 0; j < c1; j++)\n            scanf("%d", &a[i][j]);\n\n    printf("Doosre matrix ke elements darj karein:\\n");\n    for (int i = 0; i < r2; i++)\n        for (int j = 0; j < c2; j++)\n            scanf("%d", &b[i][j]);\n\n    for (int i = 0; i < r1; i++) {\n        for (int j = 0; j < c2; j++) {\n            c[i][j] = 0;\n            for (int k = 0; k < c1; k++)\n                c[i][j] += a[i][k] * b[k][j];\n        }\n    }\n\n    printf("Parinam matrix:\\n");\n    for (int i = 0; i < r1; i++) {\n        for (int j = 0; j < c2; j++)\n            printf("%d\\t", c[i][j]);\n        printf("\\n");\n    }\n    return 0;\n}`,
  prime:`#include <stdio.h>\n\nint main() {\n    int n, i, flag=0;\n    printf("Number enter karein: ");\n    scanf("%d", &n);\n    if(n<=1) flag=1;\n    for(i=2;i<=n/2;i++) if(n%i==0){flag=1;break;}\n    printf(flag==0?"%d Prime hai\\n":"%d Prime nahi hai\\n", n);\n    return 0;\n}`,
  fact:`#include <stdio.h>\n\nint main() {\n    int n, i; unsigned long long f=1;\n    printf("Number enter karein: ");\n    scanf("%d", &n);\n    for(i=1;i<=n;i++) f*=i;\n    printf("Factorial = %llu\\n", f);\n    return 0;\n}`
};

const ta=document.getElementById('code'), ln=document.getElementById('lineNums');
let cm=null;

function updLines(){
  const n=ta.value.split('\n').length;
  ln.innerHTML=Array.from({length:n},(_,i)=>i+1).join('<br>');
}
ta.addEventListener('scroll',()=>{ln.scrollTop=ta.scrollTop});

function tryCM(){
  if(typeof CodeMirror!=='undefined' && !cm){
    const v=ta.value;
    ln.style.display='none';
    cm=CodeMirror.fromTextArea(ta,{mode:'text/x-csrc',theme:'dracula',lineNumbers:true,indentUnit:4,tabSize:4,lineWrapping:true});
    cm.setValue(v);
    cm.on('change',onChg);
  }
}
tryCM();
window.addEventListener('load',tryCM);

const getC=()=>cm?cm.getValue():ta.value;
const setC=v=>{if(cm)cm.setValue(v);else{ta.value=v;updLines();}};

const sv=localStorage.getItem('sp_c_code');
if(sv&&sv.trim()) setC(sv);
updLines();

function onChg(){
  updLines();
  localStorage.setItem('sp_c_code',getC());
  document.getElementById('svTxt').textContent='• Saved';
}
ta.addEventListener('input',onChg);

function saveHist(c){
  if(!c.trim())return;
  let h=JSON.parse(localStorage.getItem('sp_c_hist')||'[]');
  if(h.length&&h[0].c.trim()===c.trim())return;
  h.unshift({t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),c});
  localStorage.setItem('sp_c_hist',JSON.stringify(h.slice(0,15)));
}

function openHist(){
  const list=document.getElementById('hList'), h=JSON.parse(localStorage.getItem('sp_c_hist')||'[]');
  list.innerHTML=h.length?'':'<p style="font-size:13px;color:#a6adc8">Koi saved program nahi hai.</p>';
  h.forEach((x,i)=>{
    const d=document.createElement('div');d.className='h-item';
    d.innerHTML=`<div style="font-size:11px;color:#f9e2af">#${i+1} • ${x.t}</div><div style="font-family:monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.c.replace(/\n/g,' '))}</div>`;
    d.onclick=()=>{setC(x.c);document.getElementById('modal').style.display='none';clrTerm();};
    list.appendChild(d);
  });
  document.getElementById('modal').style.display='flex';
}

function loadEx(){
  const s=document.getElementById('exSel');
  if(s.value&&EX[s.value]){saveHist(getC());setC(EX[s.value]);clrTerm();}
  s.value='';
}

const out=document.getElementById('out'),rBtn=document.getElementById('runBtn'),st=document.getElementById('stTxt');
let grps=[],toks=[],gIdx=0,tInG=0,running=false,vars={},activeInp=null;

function focusInline(){
  if(activeInp) activeInp.focus();
}

function clrTerm(){
  activeInp=null;
  out.innerHTML='';
  st.textContent='Ready';
}

function parseCode(code){
  const cl=code.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,''),lines=cl.split('\n'),res=[];
  let p='',loops=[],inIf=false;
  lines.forEach((l,i)=>{
    const t=l.trim();
    if(/^if\s*\(/.test(t)){inIf=true;return;}
    if(inIf){if(t.includes('}'))inIf=false;return;}
    const fm=t.match(/\bfor\s*\([^;]*;\s*[a-zA-Z_]\w*\s*(<=|<)\s*([a-zA-Z0-9_]+)\s*;/);
    if(fm)loops.push({op:fm[1],b:fm[2],i});
    const pm=t.match(/\bprintf\s*\(\s*"((?:[^"\\]|\\.)*)"\s*\)\s*;/);
    if(pm&&!/%[sdfclux]/i.test(pm[1]))p+=pm[1].replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\"/g,'"');
    const sm=t.match(/\bscanf\s*\(\s*"([^"]*)"\s*,\s*([^)]+)\)/);
    if(sm){
      const sp=sm[1].match(/%[0-9.]*[diuoxXfFeEgGaAcsp]/g)||['%d'];
      const vn=sm[2].split(',').map(v=>v.replace(/&/g,'').trim());
      res.push({p:p||'Enter value: ',cnt:sp.length,sp,vn,lp:loops.filter(x=>i-x.i<=4)});
      p='';loops=[];
    }
  });
  return res;
}

function expCnt(g){
  let m=1;
  g.lp.forEach(x=>{let b=parseInt(x.b,10);if(isNaN(b))b=vars[x.b]!==undefined?vars[x.b]:1;if(x.op==='<=')b++;if(b>0)m*=b;});
  return g.cnt*m;
}

async function runCode(){
  const c=getC();saveHist(c);toks=[];gIdx=0;tInG=0;vars={};running=true;activeInp=null;out.innerHTML='';rBtn.disabled=true;
  grps=parseCode(c);
  if(grps.length)showP(true);else await execAPI();
}

function showP(first){
  const g=grps[gIdx],tot=expCnt(g),rem=tot-tInG;
  const promptSpan=document.createElement('span');
  if(first){
    promptSpan.textContent=g.p;
  }else{
    promptSpan.className='hint';
    promptSpan.textContent=`↳ (${rem} aur): `;
  }
  out.appendChild(promptSpan);

  const inp=document.createElement('input');
  inp.type='text';
  inp.className='inline-inp';
  inp.autocomplete='off';
  inp.autocorrect='off';
  inp.spellcheck=false;
  inp.addEventListener('input',()=>{
    inp.style.width=Math.max(80,(inp.value.length+2)*10)+'px';
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      sendIn(inp);
    }
  });

  out.appendChild(inp);
  activeInp=inp;
  out.scrollTop=out.scrollHeight;
  st.textContent=`Input (${tInG}/${tot})`;
  setTimeout(()=>inp.focus(),10);
}

async function sendIn(inp){
  if(!running||!inp)return;
  const raw=inp.value.trim();
  if(!raw){
    inp.placeholder='value likhein...';
    inp.focus();
    return;
  }
  const g=grps[gIdx],tot=expCnt(g),nt=raw.split(/\s+/);
  for(let i=0;i<nt.length;i++){
    const sp=g.sp[(tInG+i)%g.sp.length];
    if(/%[diu]/i.test(sp)&&!/^-?\d+$/.test(nt[i])){
      const errSpan=document.createElement('span');
      errSpan.className='err';
      errSpan.textContent=`\n⚠ '${nt[i]}' number nahi hai! Dobara likhein: `;
      inp.replaceWith(document.createTextNode(raw));
      out.appendChild(errSpan);
      const retryInp=document.createElement('input');
      retryInp.type='text';
      retryInp.className='inline-inp';
      retryInp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendIn(retryInp);}});
      out.appendChild(retryInp);
      activeInp=retryInp;
      out.scrollTop=out.scrollHeight;
      retryInp.focus();
      return;
    }
  }

  const valSpan=document.createElement('span');
  valSpan.className='u-in';
  valSpan.textContent=raw+'\n';
  inp.replaceWith(valSpan);
  activeInp=null;

  if(g.lp.length===0)nt.forEach((t,i)=>{const v=g.vn[tInG+i];if(v&&!isNaN(parseInt(t,10)))vars[v]=parseInt(t,10);});
  toks.push(...nt);
  tInG+=nt.length;

  if(tInG<tot)showP(false);
  else{
    gIdx++;tInG=0;
    if(gIdx<grps.length)showP(true);
    else await execAPI();
  }
}

async function fetchWithTimeout(url, opts, ms=7000){
  const ctrl=new AbortController();
  const id=setTimeout(()=>ctrl.abort(),ms);
  try{
    const res=await fetch(url,{...opts,signal:ctrl.signal});
    clearTimeout(id);
    return res;
  }catch(e){
    clearTimeout(id);
    throw e;
  }
}

async function execAPI(){
  st.textContent='Compiling...';
  const code=getC();
  const stdinStr=toks.length?toks.join('\n')+'\n':'';
  const payload=JSON.stringify({compiler:'gcc-head-c',code:code,stdin:stdinStr,save:false});

  const endpoints=[
    'https://wandbox.org/api/compile.json',
    'https://corsproxy.io/?' + encodeURIComponent('https://wandbox.org/api/compile.json')
  ];

  for(let idx=0;idx<endpoints.length;idx++){
    try{
      if(idx>0) st.textContent='Retrying via Proxy...';
      const r=await fetchWithTimeout(endpoints[idx],{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:payload
      },8000);
      if(!r.ok) continue;
      const d=await r.json();
      if(d.program_error && d.program_error.includes('Resource temporarily unavailable')){
        await new Promise(x=>setTimeout(x,800));
        continue;
      }
      if(d.compiler_error){
        out.innerHTML=`<span class="err">Compilation Error:\n${esc(d.compiler_error)}</span>`;
        done('Error');return;
      }
      let rem=d.program_output||'';
      grps.forEach(g=>{if(rem.startsWith(g.p))rem=rem.slice(g.p.length);});
      if(rem)out.innerHTML+=esc(rem);
      if(d.program_error)out.innerHTML+=`\n<span class="err">${esc(d.program_error)}</span>`;
      out.innerHTML+=`\n\n<span class="sys">--- Finished (Exit Code: ${d.status??0}) ---</span>`;
      out.scrollTop=out.scrollHeight;done('Finished');return;
    }catch(e){}
  }

  // Fallback: Built-in Local C Interpreter for standard C programs if network blocks external APIs
  try{
    const simOut=runLocalCSimulator(code, toks);
    if(simOut!==null){
      out.innerHTML+=esc(simOut);
      out.innerHTML+=`\n\n<span class="sys">--- Finished (Local Fast Engine • Exit Code: 0) ---</span>`;
      out.scrollTop=out.scrollHeight;done('Finished');return;
    }
  }catch(simErr){}

  out.innerHTML+=`\n<span class="err">Network Error: Server se connect nahi ho paya.</span>`;
  done('Failed');
}

// Built-in lightweight C evaluator for basic arithmetic, loops & matrix programs when cloud API is unreachable
function runLocalCSimulator(code, inputTokens){
  const clean=code.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'');
  if(/#include\s*<string\.h>|#include\s*<math\.h>|malloc|struct|pointer|\*/.test(clean.replace(/a\[i\]\[k\]\s*\*\s*b\[k\]\[j\]/g,''))) return null;

  let ptr=0;
  const nextInt=()=>ptr<inputTokens.length?parseInt(inputTokens[ptr++],10):0;
  const scope={};
  const arrays={};
  let output='';

  const evalExpr=(expr)=>{
    let e=expr.trim();
    e=e.replace(/([a-zA-Z_]\w*)\[([^\]]+)\]\[([^\]]+)\]/g,(_,arr,i,j)=>{
      const iv=evalExpr(i), jv=evalExpr(j);
      return (arrays[arr]&&arrays[arr][iv]&&arrays[arr][iv][jv]!==undefined)?arrays[arr][iv][jv]:0;
    });
    e=e.replace(/([a-zA-Z_]\w*)\[([^\]]+)\]/g,(_,arr,i)=>{
      const iv=evalExpr(i);
      return (arrays[arr]&&arrays[arr][iv]!==undefined)?arrays[arr][iv]:0;
    });
    e=e.replace(/\b([a-zA-Z_]\w*)\b/g,(m)=>scope[m]!==undefined?scope[m]:m);
    try{return Function('"use strict";return ('+e+')')();}catch(_){return 0;}
  };

  // Detect matrix multiplication pattern
  if(clean.includes('c[i][j] += a[i][k] * b[k][j]')){
    const r1=nextInt(), c1=nextInt(), r2=nextInt(), c2=nextInt();
    if(c1!==r2) return 'Guna sambhav nahi hai: pehle matrix ke columns, doosre ke rows ke barabar hone chahiye.\n';
    const A=Array.from({length:r1},()=>Array.from({length:c1},()=>nextInt()));
    const B=Array.from({length:r2},()=>Array.from({length:c2},()=>nextInt()));
    let res='Parinam matrix:\n';
    for(let i=0;i<r1;i++){
      for(let j=0;j<c2;j++){
        let s=0;
        for(let k=0;k<c1;k++) s+=A[i][k]*B[k][j];
        res+=s+'\t';
      }
      res+='\n';
    }
    return res;
  }

  // Detect matrix addition pattern
  if(clean.includes('sum[i][j] = A[i][j] + B[i][j]')||clean.includes('sum[i][j]=A[i][j]+B[i][j]')){
    const r=nextInt(), c=nextInt();
    const A=Array.from({length:r},()=>Array.from({length:c},()=>nextInt()));
    const B=Array.from({length:r},()=>Array.from({length:c},()=>nextInt()));
    let res='Matrices ka jod:\n';
    for(let i=0;i<r;i++){
      for(let j=0;j<c;j++) res+=(A[i][j]+B[i][j])+'\t';
      res+='\n';
    }
    return res;
  }

  // General simple sequential C statements (e.g. a+b, factorial, prime, etc.)
  const lines=clean.split('\n');
  let skipFirstPrompt=true;
  for(let line of lines){
    line=line.trim();
    if(!line||line.startsWith('#')||line.startsWith('int main')||line==='{'||line==='}'||line.startsWith('return')) continue;
    const decl=line.match(/^(?:int|float|double|long|unsigned\s+long\s+long)\s+(.+);$/);
    if(decl){
      decl[1].split(',').forEach(part=>{
        const [k,v]=part.split('=').map(s=>s.trim());
        if(!k.includes('[')) scope[k]=v!==undefined?evalExpr(v):0;
      });
      continue;
    }
    const sc=line.match(/^scanf\s*\(\s*"[^"]*"\s*,\s*([^)]+)\)\s*;$/);
    if(sc){
      sc[1].split(',').forEach(v=>{
        const vn=v.replace(/&/g,'').trim();
        scope[vn]=nextInt();
      });
      continue;
    }
    const asg=line.match(/^([a-zA-Z_]\w*)\s*=\s*(.+);$/);
    if(asg){
      scope[asg[1]]=evalExpr(asg[2]);
      continue;
    }
    const pr=line.match(/^printf\s*\(\s*"((?:[^"\\]|\\.)*)"(?:\s*,\s*([^)]+))?\)\s*;$/);
    if(pr){
      let fmt=pr[1].replace(/\\n/g,'\n').replace(/\\t/g,'\t');
      if(!pr[2]&&skipFirstPrompt){skipFirstPrompt=false;continue;}
      if(pr[2]){
        const args=pr[2].split(',').map(a=>evalExpr(a));
        let ai=0;
        fmt=fmt.replace(/%[0-9.]*[diufFl]/g,()=>args[ai++]!==undefined?args[ai-1]:0);
      }
      output+=fmt;
    }
  }
  return output||null;
}

function done(s){running=false;rBtn.disabled=false;activeInp=null;st.textContent=s;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
