    int a[MAX][MAX], b[MAX][MAX], c[MAX][MAX];
    int r1, c1, r2, c2;
    int i, j, k;

    printf("Enter rows and columns of first matrix: ");
    scanf("%d %d", &r1, &c1);

    printf("Enter rows and columns of second matrix: ");
    scanf("%d %d", &r2, &c2);

    if(r1>MAX || c1>MAX || r2>MAX || c2>MAX ||
       r1<=0 || c1<=0 || r2<=0 || c2<=0) {
        printf("Invalid matrix size\\n");
        return 0;
    }

    if(c1!=r2) {
        printf("Multiplication not possible\\n");
        return 0;
    }

    printf("Enter first matrix elements:\\n");
    for(i=0;i<r1;i++)
        for(j=0;j<c1;j++)
            scanf("%d",&a[i][j]);

    printf("Enter second matrix elements:\\n");
    for(i=0;i<r2;i++)
        for(j=0;j<c2;j++)
            scanf("%d",&b[i][j]);

    for(i=0;i<r1;i++) {
        for(j=0;j<c2;j++) {
            c[i][j]=0;

            for(k=0;k<c1;k++)
                c[i][j]+=a[i][k]*b[k][j];

    printf("Result Matrix:\\n");

    for(i=0;i<r1;i++) {
        for(j=0;j<c2;j++)
            printf("%d\\t",c[i][j]);
        printf("\\n");
    }

}`,

const ta=document.getElementById('code');
const ln=document.getElementById('lineNums');

let cm=null;
let curFont=17;

function toggleFont(){
 curFont=curFont===17?20:(curFont===20?16:17);

 document.getElementById('fontBtn').textContent=
  curFont===20?'A-':'A+';

 ta.style.fontSize=curFont+'px';
 ln.style.fontSize=curFont+'px';
 document.getElementById('out').style.fontSize=curFont+'px';

 const cmEl=document.querySelector('.CodeMirror');

 if(cmEl){
  cmEl.style.fontSize=curFont+'px';
  if(cm)cm.refresh();
 }
}

function updLines(){
 const n=ta.value.split('\n').length;
 ln.innerHTML=Array.from({length:n},(_,i)=>i+1).join('<br>');
}

ta.addEventListener('scroll',()=>{
 ln.scrollTop=ta.scrollTop;
});

function tryCM(){
 if(typeof CodeMirror!=='undefined'&&!cm){
  const v=ta.value;
  ln.style.display='none';

  cm=CodeMirror.fromTextArea(ta,{
   mode:'text/x-csrc',
   theme:'dracula',
   lineNumbers:true,
   indentUnit:4,
   tabSize:4,
   lineWrapping:true,
   inputStyle:'contenteditable',
   viewportMargin:Infinity
  });

  cm.getWrapperElement().addEventListener('cut',e=>{
   const s=window.getSelection();
   const v=cm.getValue();

   if(s&&s.toString().replace(/\s/g,'')===v.replace(/\s/g,'')){
    e.preventDefault();

    if(e.clipboardData)
     e.clipboardData.setData('text/plain',v);

    cm.setValue('');
   }
  });

  cm.setValue(v);
  cm.on('change',onChg);
 }
}

tryCM();
window.addEventListener('load',tryCM);

const getC=()=>cm?cm.getValue():ta.value;

const setC=v=>{
 if(cm)cm.setValue(v);
 else{
  ta.value=v;
  updLines();
 }
 onChg();
};

updLines();

 try{

function openHist(){
 const list=document.getElementById('hList');
 let h=[];

 try{
  h=JSON.parse(localStorage.getItem('sp_c_hist')||'[]');
 }catch(e){h=[];}

 list.innerHTML=h.length?'':'<p style="font-size:13px;color:#a6adc8">Koi saved program nahi hai.</p>';

 h.forEach((x,i)=>{
  const d=document.createElement('div');
  d.className='h-item';

  d.innerHTML=`
   <div style="font-size:11px;color:#f9e2af">
    #${i+1} • ${esc(x.t)}
   </div>
   <div style="font-family:monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
    ${esc(x.c.replace(/\n/g,' '))}
   </div>`;

  d.onclick=()=>{
   setC(x.c);
   document.getElementById('modal').style.display='none';
   clrTerm();
  };

  list.appendChild(d);
 });

 document.getElementById('modal').style.display='flex';
}

function loadEx(){
 const s=document.getElementById('exSel');

 if(s.value&&EX[s.value]){
  saveHist(getC());
  setC(EX[s.value]);
  clrTerm();
 }

 s.value='';
}
