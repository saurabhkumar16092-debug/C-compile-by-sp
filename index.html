<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campus C Lab by SP</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b1120;
    color: #e5e7eb;
    font-family: system-ui, Arial, sans-serif;
}

header {
    background: #111827;
    border-bottom: 1px solid #334155;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    color: #38bdf8;
}

.logo small {
    display: block;
    font-size: 12px;
    color: #94a3b8;
    font-weight: normal;
}

button, select {
    background: #1e293b;
    color: white;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 11px 13px;
    font-size: 14px;
}

button {
    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

.run-btn {
    background: #16a34a;
    border: none;
    color: white;
    font-weight: bold;
}

main {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 12px;
}

.toolbar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
}

.toolbar select {
    grid-column: 1 / -1;
    width: 100%;
}

.editor-box {
    border: 1px solid #334155;
    border-radius: 10px;
    overflow: hidden;
}

.editor-title {
    background: #111827;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    gap: 5px;
    font-size: 13px;
}

/* EDITOR BIG SIZE */

.CodeMirror {
    height: 60vh !important;
    min-height: 420px;
    font-size: 18px !important;
    line-height: 1.65 !important;
    font-family: Consolas, monospace !important;
}

.CodeMirror-scroll {
    min-height: 420px;
}

.CodeMirror-gutters {
    background: #111827 !important;
}

.CodeMirror-linenumber {
    font-size: 15px;
}

/* FALLBACK TEXTAREA */

#code {
    display: block;
    width: 100%;
    height: 60vh;
    min-height: 420px;
    padding: 15px;
    background: #0b1120;
    color: white;
    font-size: 18px;
    line-height: 1.6;
    font-family: monospace;
    border: none;
    outline: none;
}

/* INPUT AND OUTPUT STACKED */

.bottom-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-top: 15px;
}

.panel {
    background: #111827;
    border: 1px solid #334155;
    border-radius: 10px;
    overflow: hidden;
}

.panel-title {
    background: #1e293b;
    padding: 13px;
    font-size: 16px;
    font-weight: bold;
}

.panel-body {
    padding: 12px;
}

/* INPUT */

#stdin {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    padding: 15px;
    background: #020617;
    color: white;
    border: 1px solid #334155;
    border-radius: 8px;
    font-size: 17px;
    line-height: 1.6;
    font-family: monospace;
}

/* OUTPUT */

#output {
    width: 100%;
    min-height: 220px;
    max-height: 500px;
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #020617;
    color: #4ade80;
    padding: 16px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 18px;
    line-height: 1.7;
}

/* STATUS */

.status {
    margin-top: 12px;
    padding: 12px;
    font-size: 13px;
    color: #94a3b8;
    overflow-wrap: anywhere;
}

footer {
    text-align: center;
    padding: 25px 10px;
    color: #64748b;
    font-size: 12px;
}

/* LIGHT THEME */

.light {
    background: #f1f5f9;
    color: #0f172a;
}

.light header,
.light .editor-title,
.light .panel-title {
    background: #e2e8f0;
    color: #0f172a;
}

.light .panel {
    background: white;
}

.light #stdin,
.light #output,
.light #code {
    background: #ffffff;
    color: #111827;
}

.light button,
.light select {
    background: white;
    color: #111827;
    border-color: #cbd5e1;
}

.light .run-btn {
    background: #16a34a;
    color: white;
}

.light .CodeMirror {
    background: white !important;
    color: #111827 !important;
}

.light .CodeMirror-gutters {
    background: #e2e8f0 !important;
}

/* MOBILE */

@media (max-width: 600px) {

    header {
        padding: 12px;
    }

    .logo {
        font-size: 19px;
    }

    main {
        padding: 9px;
    }

    .toolbar {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .toolbar select {
        grid-column: 1 / -1;
    }

    button, select {
        font-size: 14px;
        padding: 12px 8px;
    }

    .CodeMirror {
        height: 65vh !important;
        min-height: 400px;
        font-size: 18px !important;
    }

    .CodeMirror-scroll {
        min-height: 400px;
    }

    #code {
        height: 65vh;
        min-height: 400px;
        font-size: 18px;
    }

    #stdin {
        min-height: 160px;
        font-size: 17px;
    }

    #output {
        min-height: 240px;
        font-size: 18px;
    }

    .panel-title {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Campus C Lab
        <small>by SP | Online C Programming Lab</small>
    </div>

    <div>
        <button onclick="toggleTheme()">🌙 Theme</button>
        <button onclick="showHistory()">📚 History</button>
    </div>

</header>

<main>

    <div class="toolbar">

        <select id="examples" onchange="loadExample()">
            <option value="">📚 Select C Example</option>
            <option value="hello">Hello World</option>
            <option value="addition">Addition</option>
            <option value="subtraction">Subtraction</option>
            <option value="multiplication">Multiplication</option>
            <option value="evenodd">Even or Odd</option>
            <option value="largest">Largest Number</option>
            <option value="loop">For Loop</option>
            <option value="table">Multiplication Table</option>
            <option value="factorial">Factorial</option>
            <option value="prime">Prime Number</option>
            <option value="array">Array</option>
            <option value="function">Function</option>
        </select>

        <button onclick="copyCode()">📋 Copy</button>

        <button onclick="downloadCode()">⬇ Download</button>

        <button onclick="clearCode()">🗑 Clear</button>

        <button class="run-btn" onclick="runCode()">▶ RUN</button>

    </div>

    <div class="editor-box">

        <div class="editor-title">
            <span>📄 main.c</span>
            <span id="saveStatus">Auto Save ON</span>
        </div>

        <textarea id="code"></textarea>

    </div>

    <!-- INPUT -->

    <div class="bottom-grid">

        <div class="panel">

            <div class="panel-title">
                ⌨️ Program Input (scanf)
            </div>

            <div class="panel-body">

                <textarea id="stdin"
placeholder="Yahan program ke input likhen...

Example:
10
20

Agar scanf hai to input yahan den."></textarea>

            </div>

        </div>

        <!-- OUTPUT -->

        <div class="panel">

            <div class="panel-title">
                💻 Output Terminal
            </div>

            <div class="panel-body">

                <div id="output">Your program output will appear here...</div>

            </div>

        </div>

    </div>

    <div class="status" id="status">
        Ready | C Language | Online Compiler
    </div>

</main>

<footer>
    Campus C Lab by SP | Learn C Programming
</footer>

<!-- CODEMIRROR -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

<script>

/* STARTING CODE */

const starterCode = `#include <stdio.h>

int main() {
    int a, b, sum;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    sum = a + b;

    printf("Sum = %d\\n", sum);

    return 0;
}`;


/* EXAMPLES */

const examples = {

hello: `#include <stdio.h>

int main() {
    printf("Hello World!");

    return 0;
}`,

addition: `#include <stdio.h>

int main() {
    int a, b, sum;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    sum = a + b;

    printf("Sum = %d\\n", sum);

    return 0;
}`,

subtraction: `#include <stdio.h>

int main() {
    int a, b;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    printf("Difference = %d\\n", a - b);

    return 0;
}`,

multiplication: `#include <stdio.h>

int main() {
    int a, b;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    printf("Product = %d\\n", a * b);

    return 0;
}`,

evenodd: `#include <stdio.h>

int main() {
    int n;

    printf("Enter a number: ");
    scanf("%d", &n);

    if (n % 2 == 0) {
        printf("Even Number");
    } else {
        printf("Odd Number");
    }

    return 0;
}`,

largest: `#include <stdio.h>

int main() {
    int a, b;

    printf("Enter two numbers: ");
    scanf("%d %d", &a, &b);

    if (a > b) {
        printf("Largest = %d", a);
    } else {
        printf("Largest = %d", b);
    }

    return 0;
}`,

loop: `#include <stdio.h>

int main() {

    for (int i = 1; i <= 10; i++) {
        printf("%d\\n", i);
    }

    return 0;
}`,

table: `#include <stdio.h>

int main() {
    int n;

    printf("Enter number: ");
    scanf("%d", &n);

    for (int i = 1; i <= 10; i++) {
        printf("%d x %d = %d\\n", n, i, n * i);
    }

    return 0;
}`,

factorial: `#include <stdio.h>

int main() {
    int n;
    long long fact = 1;

    printf("Enter number: ");
    scanf("%d", &n);

    for (int i = 1; i <= n; i++) {
        fact = fact * i;
    }

    printf("Factorial = %lld", fact);

    return 0;
}`,

prime: `#include <stdio.h>

int main() {
    int n, i, prime = 1;

    printf("Enter number: ");
    scanf("%d", &n);

    if (n <= 1) {
        prime = 0;
    }

    for (i = 2; i * i <= n; i++) {
        if (n % i == 0) {
            prime = 0;
            break;
        }
    }

    if (prime)
        printf("Prime Number");
    else
        printf("Not Prime");

    return 0;
}`,

array: `#include <stdio.h>

int main() {
    int arr[5];
    int i;

    printf("Enter 5 numbers: ");

    for (i = 0; i < 5; i++) {
        scanf("%d", &arr[i]);
    }

    printf("Array Elements:\\n");

    for (i = 0; i < 5; i++) {
        printf("%d ", arr[i]);
    }

    return 0;
}`,

function: `#include <stdio.h>

int add(int a, int b) {
    return a + b;
}

int main() {
    int x, y;

    printf("Enter two numbers: ");
    scanf("%d %d", &x, &y);

    printf("Sum = %d", add(x, y));

    return 0;
}`
};


/* EDITOR INITIALIZATION */

let editor = null;

const codeBox = document.getElementById("code");

try {

    if (typeof CodeMirror !== "undefined") {

        editor = CodeMirror.fromTextArea(codeBox, {

            mode: "text/x-csrc",

            theme: "dracula",

            lineNumbers: true,

            indentUnit: 4,

            tabSize: 4,

            lineWrapping: false,

            autoCloseBrackets: true,

            matchBrackets: true,

            extraKeys: {
                "Ctrl-Enter": runCode,
                "Cmd-Enter": runCode,
                "Tab": function(cm) {
                    cm.replaceSelection("    ", "end");
                }
            }

        });

    }

} catch(error) {

    console.log("Editor loading error:", error);

}


/* GET AND SET CODE */

function getCode() {

    if (editor) {
        return editor.getValue();
    }

    return codeBox.value;
}


function setCode(code) {

    if (editor) {
        editor.setValue(code);
    } else {
        codeBox.value = code;
    }
}


/* AUTO SAVE */

const oldCode = localStorage.getItem("campus_c_code");

setCode(oldCode || starterCode);


function saveCurrentCode() {

    localStorage.setItem("campus_c_code", getCode());

    document.getElementById("saveStatus").textContent =
        "✓ Auto Saved";
}


if (editor) {

    editor.on("change", saveCurrentCode);

} else {

    codeBox.addEventListener("input", saveCurrentCode);

}


/* LOAD EXAMPLE */

function loadExample() {

    const value = document.getElementById("examples").value;

    if (!value) return;

    setCode(examples[value]);

    document.getElementById("stdin").value = "";

    document.getElementById("output").textContent =
        "Example loaded. Press RUN.";

    document.getElementById("status").textContent =
        "Example loaded: " + value;
}


/* COPY */

async function copyCode() {

    try {

        await navigator.clipboard.writeText(getCode());

        document.getElementById("status").textContent =
            "Code copied successfully!";

    } catch(error) {

        document.getElementById("status").textContent =
            "Copy unavailable. Select code and copy manually.";

    }
}


/* DOWNLOAD */

function downloadCode() {

    const blob = new Blob(
        [getCode()],
        { type: "text/plain" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "main.c";

    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    document.getElementById("status").textContent =
        "File downloaded: main.c";
}


/* CLEAR */

function clearCode() {

    if (confirm("Kya aap pura code clear karna chahte hain?")) {

        setCode("");

        document.getElementById("stdin").value = "";

        document.getElementById("output").textContent =
            "Editor cleared.";

        document.getElementById("status").textContent =
            "Code cleared.";
    }
}


/* HISTORY */

function saveHistory(code) {

    let history = JSON.parse(
        localStorage.getItem("campus_c_history") || "[]"
    );

    history.unshift({
        code: code,
        date: new Date().toLocaleString()
    });

    history = history.slice(0, 20);

    localStorage.setItem(
        "campus_c_history",
        JSON.stringify(history)
    );
}


function showHistory() {

    const history = JSON.parse(
        localStorage.getItem("campus_c_history") || "[]"
    );

    if (history.length === 0) {
        alert("No code history available.");
        return;
    }

    let text = "CODE HISTORY\\n\\n";

    history.forEach((item, i) => {
        text += (i + 1) + ". " + item.date + "\\n";
    });

    const choice = prompt(
        text + "\\nEnter number to restore:"
    );

    if (choice === null) return;

    const index = Number(choice) - 1;

    if (index >= 0 && index < history.length) {

        setCode(history[index].code);

        document.getElementById("status").textContent =
            "History restored successfully.";
    }
}


/* THEME */

function toggleTheme() {

    document.body.classList.toggle("light");

    const light = document.body.classList.contains("light");

    if (editor) {
        editor.setOption(
            "theme",
            light ? "default" : "dracula"
        );
    }

    localStorage.setItem(
        "campus_c_theme",
        light ? "light" : "dark"
    );
}


if (localStorage.getItem("campus_c_theme") === "light") {

    document.body.classList.add("light");

    if (editor) {
        editor.setOption("theme", "default");
    }

}


/* RUN PROGRAM */

async function runCode() {

    const code = getCode();

    const input = document.getElementById("stdin").value;

    const output = document.getElementById("output");

    const status = document.getElementById("status");

    if (!code.trim()) {

        output.textContent = "Please write C code first.";

        return;
    }

    output.textContent = "⏳ Compiling your program...";

    status.textContent = "Connecting to compiler...";

    saveHistory(code);

    try {

        const response = await fetch(
            "https://emkc.org/api/v2/piston/execute",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    language: "c",

                    version: "*",

                    files: [
                        {
                            name: "main.c",
                            content: code
                        }
                    ],

                    stdin: input,

                    args: [],

                    compile_timeout: 10000,

                    run_timeout: 3000,

                    compile_memory_limit: -1,

                    run_memory_limit: -1

                })
            }
        );

        if (!response.ok) {

            throw new Error("Compiler server error: " + response.status);

        }

        const result = await response.json();

        let resultText = "";

        if (result.compile) {

            if (result.compile.stderr) {

                resultText += "COMPILER MESSAGE:\\n";

                resultText += result.compile.stderr + "\\n";

            }

            if (result.compile.output) {

                resultText += result.compile.output + "\\n";

            }

            if (result.compile.code !== 0) {

                output.textContent =
                    resultText || "Compilation failed.";

                status.textContent =
                    "❌ Compilation Error";

                return;

            }

        }

        if (result.run) {

            if (result.run.stdout) {

                resultText += "\\nOUTPUT:\\n";

                resultText += result.run.stdout;

            }

            if (result.run.stderr) {

                resultText += "\\nERROR:\\n";

                resultText += result.run.stderr;

            }

            if (result.run.code !== 0) {

                resultText += "\\nExit Code: ";

                resultText += result.run.code;

            }

        }

        output.textContent =
            resultText || "Program executed. No output.";

        status.textContent =
            "✅ Program execution finished.";

    } catch(error) {

        output.textContent =
            "Compiler connection failed.\\n\\n"
            + error.message
            + "\\n\\nCheck internet and try again.";

        status.textContent =
            "❌ Compiler unavailable.";

    }

}


/* RESIZE EDITOR */

window.addEventListener("resize", function() {

    if (editor) {
        editor.refresh();
    }

});

</script>

</body>
</html>
